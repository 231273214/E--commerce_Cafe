<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <nav class="navbar__inner" aria-label="Principal">
    <a routerLink="/" class="navbar__logo" (click)="closeMenu()">
      <img src="/Logo_page-coffe.png" alt="Logo Café Funcional" />
    </a>

    <ul class="navbar__links" [class.navbar__links--open]="menuOpen" id="menu-principal">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      </li>
      <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">Nosotros</a></li>
      <li><a routerLink="/proximamente" routerLinkActive="active" (click)="closeMenu()">Proximamente</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a></li>
    </ul>

    <div class="navbar__actions">
      <button type="button" class="navbar__icon"
        [attr.aria-label]="'Abrir carrito, ' + cart.count() + ' productos'"
        (click)="cart.open(); closeMenu()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM1 2v2h2l3.6 7.6-1.4 2.4A2 2 0 0 0 7 17h12v-2H7.4l1.1-2h7.5a2 2 0 0 0 1.7-1l3.6-6.5A1 1 0 0 0 20.4 4H5.2l-.9-2H1Z"/>
        </svg>
        @for (n of [cart.count()]; track n) {
          @if (n > 0) {
            <span class="navbar__badge" aria-hidden="true">{{ n }}</span>
          }
        }
      </button>

      <button type="button" class="navbar__icon" aria-label="Cuenta">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </button>

      <button type="button" class="navbar__burger"
        [class.navbar__burger--open]="menuOpen"
        [attr.aria-expanded]="menuOpen"
        [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
        aria-controls="menu-principal"
        (click)="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
</header>

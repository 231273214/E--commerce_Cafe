<div class="page-banner" aria-hidden="true"></div>

<div class="about">
  <!-- Historia -->
  <section class="about__section story">
    <h2 class="about__title">Historia</h2>

    <div class="story__grid">
      @for (item of story; track item.number) {
        <article class="story__item">
          <span class="story__number">{{ item.number }}</span>
          <h3 class="story__heading">{{ item.title }}</h3>
          <p class="story__text">{{ item.text }}</p>
        </article>
      }
    </div>
  </section>

  <!-- Misión y Visión -->
  <section class="about__section">
    <h2 class="about__title">Nuestra Misión y Visión</h2>

    <div class="values">
      @for (card of valueCards; track card.key) {
        <button
          type="button"
          class="value-card"
          [class.value-card--flipped]="isFlipped(card.key)"
          [attr.aria-pressed]="isFlipped(card.key)"
          (click)="toggleCard(card.key)"
        >
          <span class="value-card__inner">
            <span class="value-card__face value-card__face--front">
              <img class="value-card__img" [src]="card.image" alt="" />
              <span class="value-card__title">{{ card.title }}</span>
            </span>
            <span class="value-card__face value-card__face--back">
              <span class="value-card__text">{{ card.text }}</span>
            </span>
          </span>
        </button>
      }
    </div>

    <p class="about__hint">Toca una tarjeta para leer más</p>
  </section>

  <!-- Equipo -->
  <section class="about__section">
    <h2 class="about__title">Equipo</h2>

    <div class="team">
      @for (member of team; track member.name) {
        <app-team-member
          [name]="member.name"
          [photo]="member.photo"
          [description]="member.description"
        />
      }
    </div>
  </section>
</div>
